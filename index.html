<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cirrus Weather</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<main class="weather-app">


    <!-- =========================================
         BACKGROUND VIDEO
    ========================================== -->

    <video
        class="background-video"
        autoplay
        muted
        loop
        playsinline
    >

        <source
            src="weather-bg.mp4"
            type="video/mp4"
        >

    </video>


    <!-- =========================================
         VIDEO OVERLAY
    ========================================== -->

    <div class="video-overlay"></div>


    <!-- =========================================
         LOCATION
    ========================================== -->

    <div
        class="location"
        id="location"
    >
        Hope, British
    </div>


    <!-- =========================================
         MAIN WEATHER
    ========================================== -->

    <section class="main-weather">

        <div class="temperature">

            <span id="temperature">
                29
            </span>

            <span class="degree">
                °
            </span>

        </div>


        <div
            class="condition"
            id="condition"
        >
            OVERCAST
        </div>


        <div class="feels-like">

            Feels like
            <span id="feels">
                35
            </span>°

        </div>

    </section>


    <!-- =========================================
         WEATHER SEMICIRCLE
    ========================================== -->

    <section class="weather-dial">

        <!-- Outer ring -->

        <div class="dial-ring ring-outer"></div>


        <!-- Middle ring -->

        <div class="dial-ring ring-middle"></div>


        <!-- Inner ring -->

        <div class="dial-ring ring-inner"></div>


        <!-- Tick marks -->

        <div class="dial-ticks"></div>


        <!-- =====================================
             WIND SPEED
        ====================================== -->

        <div class="wind-info">

            <div
                class="wind-value"
                id="windSpeed"
            >
                14
            </div>


            <div class="wind-unit">
                km/h
            </div>


            <!-- Wind icon -->

            <div class="wind-icon">

                <svg
                    viewBox="0 0 60 40"
                    aria-hidden="true"
                >

                    <path
                        d="
                            M3 10
                            H38
                            C45 10 45 2 39 2
                        "
                    />

                    <path
                        d="
                            M3 20
                            H50
                            C57 20 57 12 51 12
                        "
                    />

                    <path
                        d="
                            M3 30
                            H35
                            C42 30 42 38 36 38
                        "
                    />

                </svg>

            </div>

        </div>

    </section>


    <!-- =========================================
         FUNCTIONAL COMPASS
    ========================================== -->

    <div
        class="compass"
        id="compass"
    >

        <span class="direction north">
            N
        </span>

        <span class="direction east">
            E
        </span>

        <span class="direction south">
            S
        </span>

        <span class="direction west">
            W
        </span>


        <!-- Compass cross -->

        <div class="compass-line horizontal"></div>

        <div class="compass-line vertical"></div>


        <!-- Needle -->

        <div class="needle">

            <div class="needle-north"></div>

            <div class="needle-south"></div>

        </div>


        <!-- Center -->

        <div class="compass-center"></div>


        <!-- Heading -->

        <div
            class="compass-heading"
            id="compassHeading"
        >
            N
        </div>

    </div>


    <!-- =========================================
         BOTTOM CONTROLS
    ========================================== -->


    <!-- Search button -->

    <button
        class="search-button"
        id="searchButton"
        aria-label="Search location"
        type="button"
    >

        <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <circle
                cx="10.8"
                cy="10.8"
                r="6.5"
            ></circle>

            <line
                x1="16"
                y1="16"
                x2="21"
                y2="21"
            ></line>

        </svg>

    </button>


    <!-- =========================================
         PRECIPITATION
         Sits beside search icon
    ========================================== -->

    <div
        class="precipitation-bottom"
        id="precipitationBottom"
    >

        <span
            id="precipitation"
        >
            53%
        </span>

        <span class="precipitation-label">
            rain
        </span>

    </div>


    <!-- =========================================
         SEARCH PANEL
    ========================================== -->

    <div
        class="search-panel"
        id="searchPanel"
    >

        <input
            id="search"
            type="text"
            placeholder="Search location..."
            autocomplete="off"
        >


        <button
            class="close-search"
            id="closeSearch"
            type="button"
            aria-label="Close search"
        >
            ×
        </button>

    </div>


    <!-- =========================================
         AGROMET
    ========================================== -->

    <button
        class="agromet-button"
        id="agrometButton"
        type="button"
    >
        Agromet
    </button>


    <!-- =========================================
         COMPASS PERMISSION
    ========================================== -->

    <button
        class="compass-permission"
        id="compassPermission"
        type="button"
    >
        Enable Compass
    </button>


</main>


<script src="script.js"></script>

</body>

</html>
