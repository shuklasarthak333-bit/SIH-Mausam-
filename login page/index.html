<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                "Inter",
                "Helvetica Neue",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    black,grey,white
                );

            overflow: hidden;
        }


        /* =========================================
           LOGIN CONTAINER
        ========================================= */

        .login-container {

            width: min(900px, 92vw);

            min-height: 520px;

            display: grid;

            grid-template-columns: 1fr 1fr;

            background: #ffffff;

            border-radius: 24px;

            padding: 14px;

            box-shadow:
                0 25px 60px rgba(80, 30, 25, 0.22);

            overflow: hidden;
        }


        /* =========================================
           LEFT IMAGE
        ========================================= */

        .login-image {

            position: relative;

            min-height: 490px;

            border-radius: 17px;

            overflow: hidden;

            background: #123d5c;
        }

        .login-image img {

            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }


        /* =========================================
           IMAGE OVERLAY
        ========================================= */

        .image-overlay {

            position: absolute;

            inset: 0;

            padding: 28px;

            display: flex;

            flex-direction: column;

            justify-content: flex-start;

            background:
                linear-gradient(
                    180deg,
                    rgba(4, 22, 38, 0.42),
                    rgba(4, 22, 38, 0.02) 55%,
                    rgba(4, 22, 38, 0.30)
                );

            color: white;
        }

        .image-overlay h2 {

            max-width: 240px;

            font-size: 22px;

            line-height: 1.15;

            font-weight: 800;

            letter-spacing: -0.6px;
        }

        .image-overlay p {

            margin-top: 10px;

            max-width: 230px;

            font-size: 12px;

            line-height: 1.5;

            opacity: 0.88;
        }


        /* =========================================
           RIGHT SIDE
        ========================================= */

        .login-content {

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 45px;
        }

        .login-form {

            width: 100%;

            max-width: 330px;
        }


        /* =========================================
           HEADER
        ========================================= */

        .login-header {

            margin-bottom: 30px;

            text-align: center;
        }

        .login-header h1 {

            color: #142333;

            font-size: 27px;

            font-weight: 800;

            letter-spacing: -0.8px;
        }

        .login-header p {

            margin-top: 7px;

            color: #8995a1;

            font-size: 12px;

            line-height: 1.5;
        }


        /* =========================================
           GOOGLE BUTTON
        ========================================= */

        .google-btn {

            width: 100%;

            height: 43px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            border: 1px solid #dfe4e8;

            border-radius: 9px;

            background: #ffffff;

            color: #27333d;

            font-size: 12px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .google-btn:hover {

            background: #f7fafc;

            border-color: #cbd4da;
        }

        .google-icon {

            width: 17px;
            height: 17px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-weight: 800;

            color: #4285f4;
        }


        /* =========================================
           DIVIDER
        ========================================= */

        .divider {

            display: flex;

            align-items: center;

            gap: 10px;

            margin: 22px 0;
        }

        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background: #e7ebee;
        }

        .divider span {

            color: #a0a9b1;

            font-size: 10px;

            font-weight: 600;
        }


        /* =========================================
           FORM GROUP
        ========================================= */

        .form-group {

            margin-bottom: 15px;
        }

        .form-group label {

            display: block;

            margin-bottom: 7px;

            color: #34424d;

            font-size: 11px;

            font-weight: 700;
        }


        /* =========================================
           INPUT
        ========================================= */

        .input-wrapper {

            position: relative;
        }

        .input-wrapper input {

            width: 100%;

            height: 42px;

            padding:
                0 38px
                0 13px;

            border: 1px solid #dfe5e9;

            border-radius: 8px;

            outline: none;

            background: #ffffff;

            color: #172733;

            font-family: inherit;

            font-size: 12px;

            transition: 0.2s ease;
        }

        .input-wrapper input::placeholder {

            color: #aab2b9;
        }

        .input-wrapper input:focus {

            border-color: #4389c7;

            box-shadow:
                0 0 0 3px rgba(67, 137, 199, 0.10);
        }


        /* =========================================
           INPUT ICON
        ========================================= */

        .input-icon {

            position: absolute;

            right: 12px;

            top: 50%;

            transform: translateY(-50%);

            color: #a4adb5;

            font-size: 13px;

            pointer-events: none;
        }


        /* =========================================
           FORGOT PASSWORD
        ========================================= */

        .forgot {

            display: flex;

            justify-content: flex-end;

            margin-top: -5px;

            margin-bottom: 18px;
        }

        .forgot a {

            color: #4389c7;

            font-size: 10px;

            font-weight: 700;

            text-decoration: none;
        }

        .forgot a:hover {

            text-decoration: underline;
        }


        /* =========================================
           LOGIN BUTTON
        ========================================= */

        .login-btn {

            width: 100%;

            height: 43px;

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #2477b9,
                    #1769aa
                );

            color: white;

            font-size: 12px;

            font-weight: 700;

            border: none;

            cursor: pointer;

            box-shadow:
                0 8px 18px rgba(23, 105, 170, 0.22);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .login-btn:hover {

            transform: translateY(-1px);

            box-shadow:
                0 11px 22px rgba(23, 105, 170, 0.28);
        }

        .login-btn:active {

            transform: translateY(0);
        }


        /* =========================================
           SIGN UP
        ========================================= */

        .signup {

            margin-top: 22px;

            text-align: center;

            color: #929ba3;

            font-size: 10px;
        }

        .signup a {

            color: #2477b9;

            font-weight: 700;

            text-decoration: none;
        }

        .signup a:hover {

            text-decoration: underline;
        }


        /* =========================================
           RESPONSIVE TABLET
        ========================================= */

        @media (max-width: 750px) {

            .login-container {

                width: min(620px, 92vw);

                grid-template-columns: 0.9fr 1.1fr;

                min-height: 450px;
            }

            .login-image {

                min-height: 420px;
            }

            .login-content {

                padding: 28px;
            }

            .image-overlay {

                padding: 20px;
            }

            .image-overlay h2 {

                font-size: 18px;
            }

            .image-overlay p {

                font-size: 10px;
            }
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            body {

                padding: 20px;

                align-items: center;

                background:
                     linear-gradient(
                    135deg,
                    black,grey,white
                );
            }

            .login-container {

                width: 100%;

                max-width: 390px;

                display: flex;

                flex-direction: column;

                padding: 9px;

                border-radius: 20px;

                min-height: auto;
            }

            .login-image {

                height: 220px;

                min-height: 220px;

                flex-shrink: 0;

                border-radius: 14px;
            }

            .image-overlay {

                padding: 18px;
            }

            .image-overlay h2 {

                max-width: 190px;

                font-size: 18px;
            }

            .image-overlay p {

                max-width: 190px;

                margin-top: 6px;

                font-size: 10px;
            }

            .login-content {

                padding:
                    28px
                    20px
                    25px;
            }

            .login-form {

                max-width: 100%;
            }

            .login-header {

                margin-bottom: 22px;
            }

            .login-header h1 {

                font-size: 23px;
            }

            .google-btn,
            .login-btn {

                height: 42px;
            }
        }


        /* =========================================
           SMALL PHONES
        ========================================= */

        @media (max-width: 380px) {

            body {

                padding: 12px;
            }

            .login-container {

                padding: 7px;

                border-radius: 17px;
            }

            .login-image {

                height: 185px;

                min-height: 185px;
            }

            .image-overlay {

                padding: 15px;
            }

            .image-overlay h2 {

                font-size: 16px;
            }

            .image-overlay p {

                font-size: 9px;
            }

            .login-content {

                padding:
                    23px
                    16px
                    20px;
            }

            .login-header h1 {

                font-size: 21px;
            }

            .login-header p {

                font-size: 10px;
            }

            .divider {

                margin: 17px 0;
            }

            .form-group {

                margin-bottom: 12px;
            }

            .input-wrapper input {

                height: 40px;
            }

            .login-btn {

                height: 40px;
            }
        }


        /* =========================================
           ACCESSIBILITY
        ========================================= */

        button:focus-visible,
        input:focus-visible,
        a:focus-visible {

            outline: 2px solid #55b9e8;

            outline-offset: 3px;
        }

        @media (prefers-reduced-motion: reduce) {

            * {

                transition: none !important;

                animation: none !important;
            }
        }

    </style>
</head>

<body>

    <main class="login-container">

        <!-- =====================================
             LEFT IMAGE
        ====================================== -->

        <section class="login-image">

            <img
                src="image.png"
                alt="Beautiful weather landscape"
            >

            <div class="image-overlay">

                <h2>
                    The sky doesn't
                    have limits.
                </h2>

                <p>
                    Discover the weather.
                    Plan your day.
                    Stay ahead of every forecast.
                </p>

            </div>

        </section>


        <!-- =====================================
             RIGHT LOGIN
        ====================================== -->

        <section class="login-content">

            <form class="login-form">

                <div class="login-header">

                    <h1>
                        Welcome back 👋
                    </h1>

                    <p>
                        Sign in to continue to your weather dashboard.
                    </p>

                </div>


                <!-- GOOGLE -->

                <button
                    type="button"
                    class="google-btn"
                >

                    <span class="google-icon">
                        G
                    </span>

                    Continue with Google

                </button>


                <!-- DIVIDER -->

                <div class="divider">

                    <span>
                        OR CONTINUE WITH EMAIL
                    </span>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-wrapper">

                        <input
                            id="email"
                            type="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                        <span class="input-icon">
                            ✉
                        </span>

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <input
                            id="password"
                            type="password"
                            placeholder="••••••••"
                            autocomplete="current-password"
                            required
                        >

                        <span class="input-icon">
                            •••
                        </span>

                    </div>

                </div>


                <!-- FORGOT -->

                <div class="forgot">

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <!-- LOGIN -->

               <button
                    type=""
                    class="login-btn"
                ><a style="text-decoration: none;color: white;" href="/unified 2nd/"> 
                    Sign In</a>
                </button>


                <!-- SIGNUP -->

                <p class="signup">

                    Don't have an account?

                    <a href="#">
                        Create account
                    </a>

                </p>

            </form>

        </section>

    </main>

</body>
</html>
