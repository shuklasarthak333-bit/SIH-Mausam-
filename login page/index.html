<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Login</title>
<link rel="stylesheet" href="style.css"> 
</head>

<body>

    <main class="login-container">

        <!-- =====================================
             LEFT IMAGE
        ====================================== -->

        <section class="login-image">

            <img
                src="image.png"
                alt="Beautiful weather landscape"
            >

            <div class="image-overlay">

                <h2>
                    The sky doesn't
                    have limits.
                </h2>

                <p>
                    Discover the weather.
                    Plan your day.
                    Stay ahead of every forecast.
                </p>

            </div>

        </section>


        <!-- =====================================
             RIGHT LOGIN
        ====================================== -->

        <section class="login-content">

            <form class="login-form">

                <div class="login-header">

                    <h1>
                        Welcome back 👋
                    </h1>

                    <p>
                        Sign in to continue to your weather dashboard.
                    </p>

                </div>


                <!-- GOOGLE -->

                <button
                    type="button"
                    class="google-btn"
                >

                    <span class="google-icon">
                        G
                    </span>

                    Continue with Google

                </button>


                <!-- DIVIDER -->

                <div class="divider">

                    <span>
                        OR CONTINUE WITH EMAIL
                    </span>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-wrapper">

                        <input
                            id="email"
                            type="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                        <span class="input-icon">
                            ✉
                        </span>

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <input
                            id="password"
                            type="password"
                            placeholder="••••••••"
                            autocomplete="current-password"
                            required
                        >

                        <span class="input-icon">
                            •••
                        </span>

                    </div>

                </div>


                <!-- FORGOT -->

                <div class="forgot">

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <!-- LOGIN -->

               <button
    type="button"
    class="login-btn"
    onclick="window.location.href='../unified 2nd/index.html';"
>
    Sign In
</button>


                <!-- SIGNUP -->

                <p class="signup">

                    Don't have an account?

                    <a href="#">
                        Create account
                    </a>

                </p>

            </form>

        </section>

    </main>

</body>
</html>
